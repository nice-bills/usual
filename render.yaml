services:
  - type: web
    name: usual
    runtime: node
    plan: free
    region: virginia # Groq's speech calls run from the US
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: USUAL_MOCK # read at build time too: the page bakes in its mode
        value: "1"
      - key: USUAL_TRACE
        value: stdout
      - key: MCP_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_API_KEY
        sync: false
